[project]
name = "buildstock-weatherreg"
version = "0.1.0"
description = "ResStock/ComStock EULP Weather-Year Regression Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core scientific stack
    "numpy<2.0",
    "pandas>=2.1,<3",
    "scipy>=1.10",
    "scikit-learn>=1.1",
    "matplotlib>=3.8",
    "seaborn>=0.12",
    # Data / IO
    "pyarrow>=14",
    "polars>=0.20",
    # AWS
    "boto3>=1.29",
    # ML
    "tensorflow>=2.16",
    # Data querying
    "pyathena>=3",
    # Web / dashboards
    "requests>=2.31",
    "plotly>=5.22",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "dash-extensions>=1.0",
    "dash-iconify>=0.1",
    "dash-mantine-components>=0.10,<1",
    # Utilities
    "pyyaml>=6",
    "rich>=13",
    "tabulate>=0.9",
    "joblib>=1.2",
    "s3fs>=2026.3.0",
    "buildstock-query",
    "ty>=0.0.35",
    "openpyxl>=3.1.5",
]

[tool.uv.sources]
buildstock-query = { git = "https://github.com/NatLabRockies/buildstock-query.git", rev = "v0.4.1" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "pytest>=8",
]

[tool.ty.environment]
python = ".venv/"
